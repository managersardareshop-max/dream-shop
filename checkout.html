<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Dream Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-page {
            padding: 60px 20px;
            min-height: 70vh;
        }

        .checkout-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 30px;
        }

        .checkout-box,
        .order-summary {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .checkout-box h1,
        .order-summary h2 {
            margin-bottom: 25px;
            color: #ffffff;
        }

        .checkout-box label {
            display: block;
            margin: 16px 0 8px;
            color: #dbeafe;
            font-weight: 600;
        }

        .checkout-box input,
        .checkout-box select,
        .checkout-box textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0b1220;
            color: #ffffff;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .checkout-box input:focus,
        .checkout-box select:focus,
        .checkout-box textarea:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34,211,238,0.1);
        }

        .checkout-box textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkout-items {
            margin-bottom: 25px;
        }

        .checkout-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .checkout-item img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 12px;
            background: #0b1220;
            padding: 5px;
        }

        .checkout-item-info {
            flex: 1;
        }

        .checkout-item-info h4 {
            margin: 0 0 5px;
            color: #ffffff;
            font-size: 15px;
        }

        .checkout-item-info p {
            margin: 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .checkout-item-price {
            color: #22d3ee;
            font-weight: 700;
            white-space: nowrap;
        }

        .checkout-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            color: #cbd5e1;
        }

        .total-row.final {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .total-row.final span:last-child {
            color: #22d3ee;
        }

        .confirm-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37,99,235,0.35);
        }

        .empty-checkout {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }

        @media (max-width: 850px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .checkout-page {
                padding: 35px 15px;
            }

            .checkout-box,
            .order-summary {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">Dream Shop</a>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="index.html#products">Products</a>
                <a href="index.html#categories">Categories</a>
                <a href="cart.html">Cart 🛒</a>
            </nav>
        </div>
    </header>


    <!-- Checkout -->
    <main class="checkout-page">

        <div class="checkout-container">

            <!-- Customer Information -->
            <div class="checkout-box">

                <h1>🛍️ Complete Your Order</h1>

                <form id="checkoutForm">

                    <label for="customerName">Full Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="customerPhone">Phone Number</label>
                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="01XXXXXXXXX"
                        required
                    >

                    <label for="customerDistrict">District</label>
                    <input
                        type="text"
                        id="customerDistrict"
                        placeholder="Enter your district"
                        required
                    >

                    <label for="customerAddress">Full Address</label>
                    <textarea
                        id="customerAddress"
                        placeholder="House, Road, Area, Thana..."
                        required
                    ></textarea>

                    <label for="customerNote">Order Note (Optional)</label>
                    <textarea
                        id="customerNote"
                        placeholder="Any special instructions?"
                    ></textarea>

                    <button
                        type="submit"
                        id="placeOrderButton"
                        class="confirm-btn"
                    >
                        ✅ Confirm Order
                    </button>

                </form>

            </div>


            <!-- Order Summary -->
            <div class="order-summary">

                <h2>📦 Your Order</h2>

                <div id="checkoutItems" class="checkout-items">
                    <!-- Products will appear here -->
                </div>

                <div class="checkout-total">

                    <div class="total-row">
                        <span>Total Items</span>
                        <span id="checkoutTotalItems">0</span>
                    </div>

                    <div class="total-row final">
                        <span>Total Price</span>
                        <span>৳<span id="checkoutTotalPrice">0</span></span>
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Dream Shop. All Rights Reserved.</p>
            <p>Smart Gadgets • Better Life</p>
        </div>
    </footer>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
