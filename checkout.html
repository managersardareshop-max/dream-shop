<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Dream Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           DREAM SHOP PREMIUM CHECKOUT
        ================================= */

        body {
            background: #f5f7fb !important;
            color: #172033;
        }

        .checkout-page {
            padding: 45px 20px 70px;
            min-height: 75vh;
            background: #f5f7fb;
        }

        .checkout-container {
            max-width: 1050px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 25px;
            align-items: start;
        }

        /* Main Cards */
        .checkout-box,
        .order-summary {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
        }

        /* Headings */
        .checkout-box h1 {
            margin: 0 0 25px;
            color: #111827;
            font-size: 27px;
            line-height: 1.3;
            font-weight: 800;
        }

        .order-summary h2 {
            margin: 0 0 20px;
            color: #111827;
            font-size: 21px;
            font-weight: 800;
        }

        /* Labels */
        .checkout-box label {
            display: block;
            margin: 17px 0 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        .checkout-box label:first-of-type {
            margin-top: 0;
        }

        /* Inputs */
        .checkout-box input,
        .checkout-box select,
        .checkout-box textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #d8dee8;
            background: #ffffff;
            color: #111827;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .checkout-box input::placeholder,
        .checkout-box textarea::placeholder {
            color: #9ca3af;
        }

        .checkout-box input:focus,
        .checkout-box select:focus,
        .checkout-box textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.09);
        }

        .checkout-box textarea {
            min-height: 88px;
            resize: vertical;
        }

        /* Order Items */
        .checkout-items {
            margin-bottom: 15px;
        }

        .checkout-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #edf0f4;
        }

        .checkout-item:last-child {
            border-bottom: none;
        }

        .checkout-item img {
            width: 58px;
            height: 58px;
            flex: 0 0 58px;
            object-fit: contain;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #edf0f4;
            padding: 4px;
            box-sizing: border-box;
        }

        .checkout-item-info {
            flex: 1;
            min-width: 0;
        }

        .checkout-item-info h4 {
            margin: 0 0 4px;
            color: #1f2937;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
        }

        .checkout-item-info p {
            margin: 0;
            color: #6b7280;
            font-size: 13px;
        }

        .checkout-item-price {
            color: #2563eb;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
        }

        /* Total */
        .checkout-total {
            margin-top: 10px;
            padding-top: 17px;
            border-top: 1px solid #e5e7eb;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            color: #6b7280;
            font-size: 14px;
        }

        .total-row.final {
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid #edf0f4;
            font-size: 19px;
            font-weight: 800;
            color: #111827;
        }

        .total-row.final span:last-child {
            color: #2563eb;
        }

        /* Confirm Button */
        .confirm-btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.18);
        }

        .confirm-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        /* Empty Checkout */
        .empty-checkout {
            text-align: center;
            color: #6b7280;
            padding: 25px 0;
        }

        /* Mobile */
        @media (max-width: 850px) {
            .checkout-page {
                padding: 30px 15px 55px;
            }

            .checkout-container {
                grid-template-columns: 1fr;
                gap: 18px;
                max-width: 650px;
            }

            .checkout-box,
            .order-summary {
                padding: 22px;
            }

            .order-summary {
                order: 2;
            }
        }

        @media (max-width: 500px) {
            .checkout-page {
                padding: 22px 12px 45px;
            }

            .checkout-box,
            .order-summary {
                padding: 18px;
                border-radius: 15px;
            }

            .checkout-box h1 {
                font-size: 23px;
                margin-bottom: 22px;
            }

            .order-summary h2 {
                font-size: 19px;
            }

            .checkout-box input,
            .checkout-box select,
            .checkout-box textarea {
                font-size: 14px;
                padding: 12px 13px;
            }

            .confirm-btn {
                padding: 13px 15px;
                font-size: 15px;
            }

            .checkout-item img {
                width: 52px;
                height: 52px;
                flex-basis: 52px;
            }

            .checkout-item-info h4 {
                font-size: 13px;
            }

            .checkout-item-price {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">Dream Shop</a>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="index.html#products">Products</a>
                <a href="index.html#categories">Categories</a>
                <a href="cart.html">Cart 🛒</a>
            </nav>
        </div>
    </header>


    <!-- Checkout -->
    <main class="checkout-page">

        <div class="checkout-container">

            <!-- Customer Information -->
            <div class="checkout-box">

                <h1>🛍️ Complete Your Order</h1>

                <form id="checkoutForm">

                    <label for="customerName">Full Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="customerPhone">Phone Number</label>
                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="01XXXXXXXXX"
                        required
                    >

                    <label for="customerDistrict">District</label>
                    <input
                        type="text"
                        id="customerDistrict"
                        placeholder="Enter your district"
                        required
                    >

                    <label for="customerAddress">Full Address</label>
                    <textarea
                        id="customerAddress"
                        placeholder="House, Road, Area, Thana..."
                        required
                    ></textarea>

                    <label for="customerNote">Order Note (Optional)</label>
                    <textarea
                        id="customerNote"
                        placeholder="Any special instructions?"
                    ></textarea>

                    <button
                        type="submit"
                        id="placeOrderButton"
                        class="confirm-btn"
                    >
                        ✅ Confirm Order
                    </button>

                </form>

            </div>


            <!-- Order Summary -->
            <div class="order-summary">

                <h2>📦 Your Order</h2>

                <div id="checkoutItems" class="checkout-items">
                    <!-- Products will appear here -->
                </div>

                <div class="checkout-total">

                    <div class="total-row">
                        <span>Total Items</span>
                        <span id="checkoutTotalItems">0</span>
                    </div>

                    <div class="total-row final">
                        <span>Total Price</span>
                        <span>৳<span id="checkoutTotalPrice">0</span></span>
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Dream Shop. All Rights Reserved.</p>
            <p>Smart Gadgets • Better Life</p>
        </div>
    </footer>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
