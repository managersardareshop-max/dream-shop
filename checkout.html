<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b18"
    >

    <title>Checkout | Dream Shop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           DREAM SHOP — PREMIUM CHECKOUT
           Theme: Deep Indigo + Electric Cyan
        ===================================================== */

        body {

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(59, 130, 246, 0.13),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(6, 182, 212, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080b18 0%,
                    #0b1024 48%,
                    #08131f 100%
                ) !important;

            color: #f4f7ff;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .site-header {

            background:
                linear-gradient(
                    135deg,
                    rgba(8, 11, 24, 0.96),
                    rgba(10, 18, 38, 0.94)
                ) !important;

            border-bottom:
                1px solid
                rgba(56, 189, 248, 0.14);

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.22);
        }


        .logo a {
            color: #ffffff !important;
        }


        .logo a span {
            color: #22d3ee !important;
        }


        .main-nav a {
            color: #b8c4dc !important;
        }


        .main-nav a:hover {
            color: #67e8f9 !important;
        }


        /* =====================================================
           CHECKOUT PAGE
        ===================================================== */

        .checkout-page {

            padding:
                45px 20px 70px;

            min-height:
                75vh;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(37, 99, 235, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 75%,
                    rgba(6, 182, 212, 0.08),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #080b18,
                    #0a1022 50%,
                    #07131d
                );
        }


        .checkout-container {

            max-width:
                1050px;

            margin:
                0 auto;

            display:
                grid;

            grid-template-columns:
                minmax(0, 1fr)
                360px;

            gap:
                25px;

            align-items:
                start;
        }


        /* =====================================================
           CHECKOUT BOX
        ===================================================== */

        .checkout-box,
        .order-summary {

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 26, 55, 0.96),
                    rgba(10, 17, 37, 0.96)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.16);

            border-radius:
                18px;

            padding:
                28px;

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.28),
                inset 0 1px 0
                rgba(255, 255, 255, 0.025);

            backdrop-filter:
                blur(16px);
        }


        .checkout-box h1 {

            margin:
                0 0 25px;

            color:
                #f8fbff;

            font-size:
                28px;

            line-height:
                1.2;

            letter-spacing:
                -0.4px;
        }


        .order-summary h2 {

            margin:
                0 0 22px;

            color:
                #f8fbff;

            font-size:
                22px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .checkout-box label {

            display:
                block;

            margin:
                17px 0 8px;

            color:
                #c8d4ea;

            font-size:
                14px;

            font-weight:
                600;
        }


        .checkout-box input,
        .checkout-box select,
        .checkout-box textarea {

            width:
                100%;

            box-sizing:
                border-box;

            padding:
                13px 14px;

            border-radius:
                11px;

            border:
                1px solid
                rgba(148, 163, 184, 0.18);

            background:
                rgba(6, 12, 27, 0.78);

            color:
                #f5f8ff;

            outline:
                none;

            font-family:
                inherit;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .checkout-box input::placeholder,
        .checkout-box textarea::placeholder {

            color:
                #66728c;
        }


        .checkout-box input:focus,
        .checkout-box select:focus,
        .checkout-box textarea:focus {

            border-color:
                rgba(34, 211, 238, 0.65);

            background:
                rgba(8, 18, 38, 0.92);

            box-shadow:
                0 0 0 3px
                rgba(34, 211, 238, 0.08),
                0 0 22px
                rgba(34, 211, 238, 0.06);
        }


        .checkout-box textarea {

            min-height:
                105px;

            resize:
                vertical;
        }


        /* =====================================================
           CHECKOUT ITEMS
        ===================================================== */

        .checkout-items {

            display:
                flex;

            flex-direction:
                column;

            gap:
                12px;
        }


        .checkout-item {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            padding:
                12px;

            border-radius:
                13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(18, 30, 62, 0.90),
                    rgba(10, 19, 39, 0.90)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.12);
        }


        .checkout-item img {

            width:
                62px;

            height:
                62px;

            object-fit:
                cover;

            border-radius:
                10px;

            background:
                #0b1224;

            border:
                1px solid
                rgba(148, 163, 184, 0.12);
        }


        .checkout-item-info {

            flex:
                1;

            min-width:
                0;
        }


        .checkout-item-info h4 {

            margin:
                0 0 5px;

            color:
                #f1f6ff;

            font-size:
                14px;
        }


        .checkout-item-info p {

            margin:
                0;

            color:
                #8997b2;

            font-size:
                13px;
        }


        .checkout-item-price {

            color:
                #67e8f9;

            font-weight:
                700;

            white-space:
                nowrap;
        }


        /* =====================================================
           TOTAL
        ===================================================== */

        .checkout-total {

            margin-top:
                22px;

            padding-top:
                18px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.13);
        }


        .total-row {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                8px 0;

            color:
                #9eabc2;

            font-size:
                14px;
        }


        .total-row.final {

            margin-top:
                8px;

            padding-top:
                15px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.10);

            color:
                #eef5ff;

            font-size:
                17px;

            font-weight:
                700;
        }


        .total-row.final span:last-child {

            color:
                #67e8f9;

            font-size:
                22px;

            text-shadow:
                0 0 18px
                rgba(34, 211, 238, 0.18);
        }


        /* =====================================================
           CONFIRM BUTTON
        ===================================================== */

        .confirm-btn {

            width:
                100%;

            margin-top:
                24px;

            padding:
                14px 18px;

            border:
                0;

            border-radius:
                12px;

            cursor:
                pointer;

            color:
                #ffffff;

            font-size:
                15px;

            font-weight:
                700;

            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #4f46e5
                );

            box-shadow:
                0 10px 28px
                rgba(34, 211, 238, 0.12);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }


        .confirm-btn:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.08);

            box-shadow:
                0 14px 35px
                rgba(34, 211, 238, 0.20);
        }


        .confirm-btn:active {

            transform:
                translateY(0);
        }


        .confirm-btn:disabled {

            opacity:
                0.65;

            cursor:
                not-allowed;

            transform:
                none;

            filter:
                none;
        }


        /* =====================================================
           STATUS MESSAGE
        ===================================================== */

        .checkout-message {

            display:
                none;

            margin-top:
                15px;

            padding:
                12px 14px;

            border-radius:
                10px;

            font-size:
                13px;

            line-height:
                1.5;
        }


        .checkout-message.error {

            display:
                block;

            color:
                #fecaca;

            background:
                rgba(127, 29, 29, 0.30);

            border:
                1px solid
                rgba(248, 113, 113, 0.20);
        }


        .checkout-message.success {

            display:
                block;

            color:
                #bbf7d0;

            background:
                rgba(20, 83, 45, 0.30);

            border:
                1px solid
                rgba(74, 222, 128, 0.20);
        }


        /* =====================================================
           EMPTY CHECKOUT
        ===================================================== */

        .empty-checkout {

            padding:
                35px 15px;

            text-align:
                center;

            color:
                #8c99b1;
        }


        .empty-checkout strong {

            display:
                block;

            margin-bottom:
                8px;

            color:
                #dbeafe;

            font-size:
                16px;
        }


        .empty-checkout a {

            display:
                inline-block;

            margin-top:
                15px;

            padding:
                10px 16px;

            border-radius:
                9px;

            color:
                #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #4f46e5
                );

            text-decoration:
                none;

            font-size:
                13px;

            font-weight:
                600;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .site-footer {

            background:
                linear-gradient(
                    135deg,
                    #050814,
                    #07111d
                ) !important;

            border-top:
                1px solid
                rgba(34, 211, 238, 0.10);
        }


        .site-footer p {

            color:
                #77849c;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .checkout-container {

                grid-template-columns:
                    1fr;
            }

            .order-summary {

                order:
                    2;
            }
        }


        @media (max-width: 500px) {

            .checkout-page {

                padding:
                    30px 14px 55px;
            }


            .checkout-box,
            .order-summary {

                padding:
                    20px;

                border-radius:
                    15px;
            }


            .checkout-box h1 {

                font-size:
                    23px;
            }


            .checkout-item img {

                width:
                    55px;

                height:
                    55px;
            }


            .checkout-item-price {

                font-size:
                    13px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="site-header">

        <div class="container">

            <div class="logo">

                <a href="index.html">
                    Dream <span>Shop</span>
                </a>

            </div>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a href="cart.html">
                    Cart 🛒
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         CHECKOUT
    ===================================================== -->

    <main class="checkout-page">

        <div class="checkout-container">


            <!-- =================================================
                 CHECKOUT FORM
            ================================================== -->

            <div class="checkout-box">

                <h1>
                    🛍️ Complete Your Order
                </h1>


                <form id="checkoutForm">


                    <label for="customerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >


                    <label for="customerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="01XXXXXXXXX"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >


                    <label for="customerDistrict">
                        District
                    </label>

                    <input
                        type="text"

                        placeholder="Enter your district"
                        autocomplete="address-level2"

                    >


                    <label for="customerAddress">
                        Full Address
                    </label>

                    <textarea
                        id="customerAddress"
                        placeholder="House, road, area, thana etc."

                    ></textarea>


                    <label for="customerNote">

                    </label>

                    <textarea
                        id="customerNote"
                        placeholder="Any special instructions?"
                    ></textarea>


                    <div
                        id="checkoutMessage"
                        class="checkout-message"
                    ></div>


                    <button
                        type="submit"
                        id="placeOrderButton"
                        class="confirm-btn"
                    >
                        ✅ Confirm Order
                    </button>

                </form>

            </div>



            <!-- =================================================
                 ORDER SUMMARY
            ================================================== -->

            <div class="order-summary">

                <h2>
                    📦 Your Order
                </h2>


                <div
                    id="checkoutItems"
                    class="checkout-items"
                ></div>


                <div
                    class="checkout-total"
                    id="checkoutTotalBox"
                    style="display:none;"
                >

                    <div class="total-row">

                        <span>
                            Total Items
                        </span>

                        <span id="checkoutTotalItems">
                            0
                        </span>

                    </div>


                    <div class="total-row">

                        <span>
                            Subtotal
                        </span>

                        <span>
                            ৳<span id="checkoutSubtotal">0</span>
                        </span>

                    </div>


                    <div class="total-row final">

                        <span>
                            Total Price
                        </span>

                        <span>
                            ৳<span id="checkoutTotalPrice">0</span>
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Dream Shop. All Rights Reserved.
            </p>

            <p>
                Smart Gadgets • Better Life
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         CHECKOUT SYSTEM
    ===================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const SUPABASE_URL =
            "https://lwnisnbsfqqmrifujnbw.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_G2Lrr0dofsmmEWqJACdXrw_GuRHwitt";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =====================================================
           STORAGE KEYS
        ===================================================== */

        const CART_KEY =
            "dreamShopCart";

        const BUY_NOW_KEY =
            "dreamShopBuyNow";



        /* =====================================================
           GLOBAL ORDER DATA
        ===================================================== */

        let checkoutItems = [];

        let checkoutTotal =
            0;

        let checkoutTotalItems =
            0;

        let orderSubmitting =
            false;



        /* =====================================================
           HELPERS
        ===================================================== */

        function safeNumber(value) {

            const number =
                Number(value);

            return Number.isFinite(number)
                ? number
                : 0;
        }


        function formatMoney(value) {

            return Math.round(
                safeNumber(value)
            ).toLocaleString("en-BD");
        }


        function safeImage(image) {

            if (
                typeof image === "string" &&
                image.trim() !== ""
            ) {

                return image;
            }

            return "images/placeholder.png";
        }


        function getStorageJSON(key) {

            try {

                const value =
                    localStorage.getItem(key);

                if (!value) {
                    return null;
                }

                return JSON.parse(value);

            } catch (error) {

                console.error(
                    "Storage read error:",
                    error
                );

                return null;
            }
        }



        /* =====================================================
           NORMALIZE PRODUCT
        ===================================================== */

        function normalizeProduct(product) {

            if (!product || typeof product !== "object") {
                return null;
            }


            const id =
                product.id ||
                product.product_id ||
                product.productId ||
                product.slug ||
                "";


            const name =
                product.name ||
                product.product_name ||
                product.title ||
                "Product";


            const price =
                safeNumber(
                    product.price ??
                    product.unit_price ??
                    product.product_price
                );


            let quantity =
                safeNumber(
                    product.quantity ??
                    product.qty ??
                    product.count ??
                    1
                );


            if (quantity < 1) {
                quantity = 1;
            }


            quantity =
                Math.min(
                    Math.floor(quantity),
                    20
                );


            const image =
                product.image ||
                product.img ||
                product.image_url ||
                product.thumbnail ||
                "images/placeholder.png";


            return {

                id:
                    String(id),

                name:
                    String(name),

                price:
                    price,

                quantity:
                    quantity,

                image:
                    image

            };
        }



        /* =====================================================
           MERGE DUPLICATE PRODUCTS
        ===================================================== */

        function mergeProducts(products) {

            const merged =
                new Map();


            products.forEach(product => {

                const item =
                    normalizeProduct(product);


                if (!item) {
                    return;
                }


                const key =
                    item.id ||
                    item.name;


                if (merged.has(key)) {

                    const old =
                        merged.get(key);


                    old.quantity =
                        Math.min(
                            old.quantity +
                            item.quantity,
                            20
                        );

                } else {

                    merged.set(
                        key,
                        item
                    );
                }

            });


            return Array.from(
                merged.values()
            );
        }



        /* =====================================================
           GET BUY NOW PRODUCT
        ===================================================== */

        function getBuyNowProduct() {

            const buyNow =
                getStorageJSON(
                    BUY_NOW_KEY
                );


            if (!buyNow) {
                return null;
            }


            /*
             * Some versions of the website
             * may store an array here.
             */

            if (Array.isArray(buyNow)) {

                return buyNow.length
                    ? buyNow
                    : null;
            }


            return buyNow;
        }



        /* =====================================================
           GET CART PRODUCTS
        ===================================================== */

        function getCartProducts() {

            const cart =
                getStorageJSON(
                    CART_KEY
                );


            if (!cart) {
                return [];
            }


            if (Array.isArray(cart)) {

                return cart;
            }


            /*
             * Compatibility with
             * object-based cart storage.
             */

            if (
                typeof cart === "object"
            ) {

                return Object.values(
                    cart
                );
            }


            return [];
        }



        /* =====================================================
           LOAD CHECKOUT PRODUCTS
        ===================================================== */

        function loadCheckoutProducts() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const buyNowParam =
                urlParams.get(
                    "buyNow"
                );


            let products = [];


            /*
             * -------------------------------------------------
             * PRIORITY 1
             * URL buyNow parameter
             * -------------------------------------------------
             */

            if (buyNowParam) {

                const buyNow =
                    getBuyNowProduct();


                if (buyNow) {

                    if (
                        Array.isArray(
                            buyNow
                        )
                    ) {

                        products =
                            buyNow;

                    } else {

                        products =
                            [buyNow];
                    }
                }
            }


            /*
             * -------------------------------------------------
             * PRIORITY 2
             * Stored Buy Now
             * -------------------------------------------------
             */

            if (
                products.length === 0
            ) {

                const buyNow =
                    getBuyNowProduct();


                if (buyNow) {

                    if (
                        Array.isArray(
                            buyNow
                        )
                    ) {

                        products =
                            buyNow;

                    } else {

                        products =
                            [buyNow];
                    }
                }
            }


            /*
             * -------------------------------------------------
             * PRIORITY 3
             * Cart
             * -------------------------------------------------
             */

            if (
                products.length === 0
            ) {

                products =
                    getCartProducts();
            }


            /*
             * Normalize + merge
             */

            checkoutItems =
                mergeProducts(
                    products
                );


            /*
             * Calculate totals
             */

            checkoutTotal =
                checkoutItems.reduce(
                    (
                        total,
                        item
                    ) => {

                        return total +
                            (
                                item.price *
                                item.quantity
                            );

                    },
                    0
                );


            checkoutTotalItems =
                checkoutItems.reduce(
                    (
                        total,
                        item
                    ) => {

                        return total +
                            item.quantity;

                    },
                    0
                );


            renderCheckout();
        }



        /* =====================================================
           RENDER CHECKOUT
        ===================================================== */

        function renderCheckout() {

            const container =
                document.getElementById(
                    "checkoutItems"
                );


            const totalBox =
                document.getElementById(
                    "checkoutTotalBox"
                );


            const totalItemsElement =
                document.getElementById(
                    "checkoutTotalItems"
                );


            const subtotalElement =
                document.getElementById(
                    "checkoutSubtotal"
                );


            const totalElement =
                document.getElementById(
                    "checkoutTotalPrice"
                );


            if (!container) {
                return;
            }


            /*
             * No products
             */

            if (
                checkoutItems.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-checkout">

                        <strong>
                            🛒 No product selected
                        </strong>

                        <div>
                            Please add a product to your cart
                            before checking out.
                        </div>

                        <a href="index.html#products">
                            Browse Products
                        </a>

                    </div>

                `;


                if (totalBox) {

                    totalBox.style.display =
                        "none";
                }


                return;
            }


            /*
             * Products
             */

            container.innerHTML =
                checkoutItems
                    .map(
                        item => {

                            const subtotal =
                                item.price *
                                item.quantity;


                            return `

                                <div
                                    class="checkout-item"
                                >

                                    <img
                                        src="${safeImage(item.image)}"
                                        alt="${escapeHTML(item.name)}"
                                        onerror="this.style.opacity='0.35'"
                                    >

                                    <div
                                        class="checkout-item-info"
                                    >

                                        <h4>
                                            ${escapeHTML(item.name)}
                                        </h4>

                                        <p>
                                            ৳${formatMoney(item.price)}
                                            ×
                                            ${item.quantity}
                                        </p>

                                    </div>


                                    <div
                                        class="checkout-item-price"
                                    >
                                        ৳${formatMoney(subtotal)}
                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");


            /*
             * Totals
             */

            if (totalItemsElement) {

                totalItemsElement.textContent =
                    checkoutTotalItems;
            }


            if (subtotalElement) {

                subtotalElement.textContent =
                    formatMoney(
                        checkoutTotal
                    );
            }


            if (totalElement) {

                totalElement.textContent =
                    formatMoney(
                        checkoutTotal
                    );
            }


            if (totalBox) {

                totalBox.style.display =
                    "block";
            }
        }



        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }



        /* =====================================================
           SHOW MESSAGE
        ===================================================== */

        function showMessage(
            message,
            type = "error"
        ) {

            const element =
                document.getElementById(
                    "checkoutMessage"
                );


            if (!element) {
                return;
            }


            element.textContent =
                message;


            element.className =
                "checkout-message " +
                type;
        }



        /* =====================================================
           HIDE MESSAGE
        ===================================================== */

        function hideMessage() {

            const element =
                document.getElementById(
                    "checkoutMessage"
                );


            if (!element) {
                return;
            }


            element.textContent =
                "";


            element.className =
                "checkout-message";
        }



        /* =====================================================
           PHONE VALIDATION
        ===================================================== */

        function validatePhone(phone) {

            /*
             * Bangladesh mobile number:
             * 01XXXXXXXXX
             */

            const cleaned =
                phone
                    .replace(
                        /\s+/g,
                        ""
                    )
                    .replace(
                        /-/g,
                        ""
                    );


            return /^01[3-9]\d{8}$/.test(
                cleaned
            );
        }



        /* =====================================================
           SUBMIT ORDER
        ===================================================== */

        async function submitOrder(event) {

            event.preventDefault();


            if (orderSubmitting) {
                return;
            }


            hideMessage();


            /*
             * Check products
             */

            if (
                checkoutItems.length === 0 ||
                checkoutTotal <= 0
            ) {

                showMessage(
                    "No valid product found. Please go back and select a product.",
                    "error"
                );

                return;
            }


            /*
             * Get form data
             */

            const customerName =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();


            const customerPhone =
                document
                    .getElementById(
                        "customerPhone"
                    )
                    .value
                    .trim();


            const customerDistrict =
                document
                    .getElementById(
                        "customerDistrict"
                    )
                    .value
                    .trim();


            const customerAddress =
                document
                    .getElementById(
                        "customerAddress"
                    )
                    .value
                    .trim();


            const customerNote =
                document
                    .getElementById(
                        "customerNote"
                    )
                    .value
                    .trim();



            /* =================================================
               BASIC VALIDATION
            ================================================== */

            if (
                customerName.length < 2
            ) {

                showMessage(
                    "Please enter your full name.",
                    "error"
                );

                return;
            }


            if (
                !validatePhone(
                    customerPhone
                )
            ) {

                showMessage(
                    "Please enter a valid Bangladesh mobile number, for example 01XXXXXXXXX.",
                    "error"
                );

                return;
            }


            if (
                customerDistrict.length < 2
            ) {

                showMessage(
                    "Please enter your district.",
                    "error"
                );

                return;
            }


            if (
                customerAddress.length < 5
            ) {

                showMessage(
                    "Please enter your complete address.",
                    "error"
                );

                return;
            }



            /* =================================================
               BUTTON LOCK
            ================================================== */

            orderSubmitting =
                true;


            const button =
                document.getElementById(
                    "placeOrderButton"
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    "⏳ Placing Order...";
            }



            /* =================================================
               PREPARE ITEMS
            ================================================== */

            const orderItems =
                checkoutItems.map(
                    item => ({

                        product_id:
                            item.id,

                        name:
                            item.name,

                        price:
                            item.price,

                        quantity:
                            item.quantity,

                        subtotal:
                            item.price *
                            item.quantity,

                        image:
                            item.image

                    })
                );



            /* =================================================
               INSERT ORDER INTO SUPABASE
            ================================================== */

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .insert([{

                            status:
                                "pending",

                            customer_name:
                                customerName,

                            customer_phone:
                                customerPhone,

                            customer_district:
                                customerDistrict,

                            customer_address:
                                customerAddress,

                            customer_note:
                                customerNote,

                            items:
                                orderItems,

                            total_amount:
                                checkoutTotal,

                            total_items:
                                checkoutTotalItems

                        }])
                        .select()
                        .single();



                /* =================================================
                   SUPABASE ERROR
                ================================================== */

                if (error) {

                    console.error(
                        "Supabase order error:",
                        error
                    );


                    throw error;
                }



                /* =================================================
                   ORDER SUCCESS
                ================================================= */

                console.log(
                    "Order created:",
                    data
                );


                showMessage(
                    "Your order has been confirmed successfully!",
                    "success"
                );



                /*
                 * Clear Buy Now
                 */

                localStorage.removeItem(
                    BUY_NOW_KEY
                );


                /*
                 * Clear cart
                 *
                 * This is intentionally done after
                 * successful Supabase order creation.
                 */

                localStorage.removeItem(
                    CART_KEY
                );



                /*
                 * Save last order temporarily
                 * for thank-you page if needed.
                 */

                try {

                    localStorage.setItem(
                        "dreamShopLastOrder",
                        JSON.stringify({

                            orderId:
                                data?.id ||
                                "",

                            customerName:
                                customerName,

                            total:
                                checkoutTotal,

                            items:
                                orderItems

                        })
                    );

                } catch (storageError) {

                    console.warn(
                        "Could not save last order:",
                        storageError
                    );
                }



                /*
                 * Redirect to thank-you page.
                 *
                 * If your existing thank-you page
                 * has a different filename, change
                 * only the filename below.
                 */

                setTimeout(
                    () => {

                        window.location.href =
                            "thank-you.html";

                    },
                    700
                );



            } catch (error) {

                console.error(
                    error
                );


                let message =
                    "Order could not be placed. Please try again.";


                if (
                    error &&
                    error.message
                ) {

                    message =
                        error.message;
                }


                /*
                 * More user-friendly Supabase messages
                 */

                if (
                    error &&
                    error.code === "42501"
                ) {

                    message =
                        "Order permission is blocked in Supabase. Please check the orders table policy.";

                }


                if (
                    error &&
                    error.code === "23502"
                ) {

                    message =
                        "A required order field is missing. Please check the orders table columns.";

                }


                if (
                    error &&
                    error.code === "PGRST204"
                ) {

                    message =
                        "A column used by checkout was not found in the orders table.";

                }


                showMessage(
                    message,
                    "error"
                );



                /*
                 * Unlock button
                 */

                orderSubmitting =
                    false;


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        "✅ Confirm Order";
                }
            }
        }



        /* =====================================================
           INITIALIZE
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadCheckoutProducts();


                const form =
                    document.getElementById(
                        "checkoutForm"
                    );


                if (form) {

                    form.addEventListener(
                        "submit",
                        submitOrder
                    );
                }

            }
        );

    </script>
