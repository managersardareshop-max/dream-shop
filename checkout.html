
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b18"
    >

    <title>Checkout | Dream Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           DREAM SHOP — PREMIUM CHECKOUT
           Theme: Deep Indigo + Electric Cyan
        ===================================================== */

        body {
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(59, 130, 246, 0.13),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(6, 182, 212, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080b18 0%,
                    #0b1024 48%,
                    #08131f 100%
                ) !important;

            color: #f4f7ff;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .site-header {
            background:
                linear-gradient(
                    135deg,
                    rgba(8, 11, 24, 0.96),
                    rgba(10, 18, 38, 0.94)
                ) !important;

            border-bottom: 1px solid rgba(56, 189, 248, 0.14);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.22);
        }


        .logo a {
            color: #ffffff !important;
        }


        .logo a span {
            color: #22d3ee !important;
        }


        .main-nav a {
            color: #b8c4dc !important;
        }


        .main-nav a:hover {
            color: #67e8f9 !important;
        }


        /* =====================================================
           CHECKOUT PAGE
        ===================================================== */

        .checkout-page {

            padding: 45px 20px 70px;

            min-height: 75vh;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(37, 99, 235, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 75%,
                    rgba(6, 182, 212, 0.08),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #080b18,
                    #0a1022 50%,
                    #07131d
                );
        }


        .checkout-container {

            max-width: 1050px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                360px;

            gap: 25px;

            align-items: start;
        }


        /* =====================================================
           CHECKOUT BOX
        ===================================================== */

        .checkout-box,
        .order-summary {

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 26, 55, 0.96),
                    rgba(10, 17, 37, 0.96)
                );

            border: 1px solid rgba(96, 165, 250, 0.16);

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(16px);
        }


        .checkout-box h1 {

            margin: 0 0 25px;

            color: #f8fbff;

            font-size: 28px;

            line-height: 1.2;

            letter-spacing: -0.4px;
        }


        .order-summary h2 {

            margin: 0 0 22px;

            color: #f8fbff;

            font-size: 22px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .checkout-box label {

            display: block;

            margin:
                17px 0
                8px;

            color: #c8d4ea;

            font-size: 14px;

            font-weight: 600;
        }


        .checkout-box input,
        .checkout-box select,
        .checkout-box textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border-radius: 11px;

            border: 1px solid rgba(148, 163, 184, 0.18);

            background:
                rgba(6, 12, 27, 0.78);

            color: #f5f8ff;

            outline: none;

            font-family: inherit;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .checkout-box input::placeholder,
        .checkout-box textarea::placeholder {

            color: #66728c;
        }


        .checkout-box input:focus,
        .checkout-box select:focus,
        .checkout-box textarea:focus {

            border-color:
                rgba(34, 211, 238, 0.65);

            background:
                rgba(8, 18, 38, 0.92);

            box-shadow:
                0 0 0 3px
                rgba(34, 211, 238, 0.08),
                0 0 22px
                rgba(34, 211, 238, 0.06);
        }


        .checkout-box textarea {

            min-height: 105px;

            resize: vertical;
        }


        /* =====================================================
           CHECKOUT ITEMS
        ===================================================== */

        .checkout-items {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .checkout-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(18, 30, 62, 0.90),
                    rgba(10, 19, 39, 0.90)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.12);
        }


        .checkout-item img {

            width: 62px;

            height: 62px;

            object-fit: cover;

            border-radius: 10px;

            background: #0b1224;

            border:
                1px solid
                rgba(148, 163, 184, 0.12);
        }


        .checkout-item-info {

            flex: 1;
        }


        .checkout-item-info h4 {

            margin: 0 0 5px;

            color: #f1f6ff;

            font-size: 14px;
        }


        .checkout-item-info p {

            margin: 0;

            color: #8997b2;

            font-size: 13px;
        }


        .checkout-item-price {

            color: #67e8f9;

            font-weight: 700;

            white-space: nowrap;
        }


        /* =====================================================
           TOTAL
        ===================================================== */

        .checkout-total {

            margin-top: 22px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.13);
        }


        .total-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 8px 0;

            color: #9eabc2;

            font-size: 14px;
        }


        .total-row.final {

            margin-top: 8px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.10);

            color: #eef5ff;

            font-size: 17px;

            font-weight: 700;
        }


        .total-row.final span:last-child {

            color: #67e8f9;

            font-size: 22px;

            text-shadow:
                0 0 18px
                rgba(34, 211, 238, 0.18);
        }


        /* =====================================================
           CONFIRM BUTTON
        ===================================================== */

        .confirm-btn {

            width: 100%;

            margin-top: 24px;

            padding: 14px 18px;

            border: 0;

            border-radius: 12px;

            cursor: pointer;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #4f46e5
                );

            box-shadow:
                0 10px 28px
                rgba(34, 211, 238, 0.12);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }


        .confirm-btn:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 14px 35px
                rgba(34, 211, 238, 0.20);
        }


        .confirm-btn:active {

            transform: translateY(0);
        }


        /* =====================================================
           EMPTY CHECKOUT
        ===================================================== */

        .empty-checkout {

            padding: 35px 15px;

            text-align: center;

            color: #8c99b1;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .site-footer {

            background:
                linear-gradient(
                    135deg,
                    #050814,
                    #07111d
                ) !important;

            border-top:
                1px solid
                rgba(34, 211, 238, 0.10);
        }


        .site-footer p {

            color: #77849c;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .checkout-container {

                grid-template-columns: 1fr;
            }

            .order-summary {

                order: 2;
            }
        }


        @media (max-width: 500px) {

            .checkout-page {

                padding:
                    30px 14px 55px;
            }


            .checkout-box,
            .order-summary {

                padding: 20px;

                border-radius: 15px;
            }


            .checkout-box h1 {

                font-size: 23px;
            }


            .checkout-item img {

                width: 55px;

                height: 55px;
            }

        }

    </style>

</head>

<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="site-header">

        <div class="container">

            <div class="logo">
                <a href="index.html">
                    Dream <span>Shop</span>
                </a>
            </div>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a href="cart.html">
                    Cart 🛒
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         CHECKOUT
    ===================================================== -->

    <main class="checkout-page">

        <div class="checkout-container">


            <!-- CHECKOUT FORM -->

            <div class="checkout-box">

                <h1>
                    🛍️ Complete Your Order
                </h1>


                <form id="checkoutForm">


                    <label for="customerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="customerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="01XXXXXXXXX"
                        required
                    >


                    <label for="customerDistrict">
                        District
                    </label>

                    <input
                        type="text"
                        id="customerDistrict"
                        placeholder="Enter your district"
                        required
                    >


                    <label for="customerAddress">
                        Full Address
                    </label>

                    <textarea
                        id="customerAddress"
                        placeholder="House, road, area, thana etc."
                        required
                    ></textarea>


                    <label for="customerNote">
                        Order Note (Optional)
                    </label>

                    <textarea
                        id="customerNote"
                        placeholder="Any special instructions?"
                    ></textarea>


                    <button
                        type="submit"
                        id="placeOrderButton"
                        class="confirm-btn"
                    >
                        ✅ Confirm Order
                    </button>

                </form>

            </div>



            <!-- ORDER SUMMARY -->

            <div class="order-summary">

                <h2>
                    📦 Your Order
                </h2>


                <div
                    id="checkoutItems"
                    class="checkout-items"
                ></div>


                <div class="checkout-total">

                    <div class="total-row">

                        <span>
                            Total Items
                        </span>

                        <span id="checkoutTotalItems">
                            0
                        </span>

                    </div>


                    <div class="total-row final">

                        <span>
                            Total Price
                        </span>

                        <span>
                            ৳<span id="checkoutTotalPrice">0</span>
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Dream Shop. All Rights Reserved.
            </p>

            <p>
                Smart Gadgets • Better Life
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>


</body>
