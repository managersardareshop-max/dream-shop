<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Dream Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           PRODUCT DETAILS PAGE
        ===================================================== */

        body {
            margin: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(76, 29, 149, 0.30), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.24), transparent 35%),
                linear-gradient(135deg, #020617, #0b1030 50%, #11113d);
            color: #ffffff;
            min-height: 100vh;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .product-details-header {
            width: 100%;
            position: relative;
            z-index: 1000;
        }

        .product-details-header .nav-container {
            width: min(1400px, 94%);
            margin: auto;

            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;

            gap: 34px;
            padding: 18px 0;
        }

        .product-details-header .logo {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .product-details-header .nav-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            min-width: 0;
        }

        .product-details-header .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.3s ease;
        }

        .product-details-header .nav-menu a:hover {
            color: #7dd3fc;
        }

        .product-details-header .nav-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            min-width: 0;
        }

        .product-details-header .search-box {
            width: 190px;
            max-width: 100%;
        }

        .product-details-header .search-box input {
            width: 100%;
            box-sizing: border-box;
        }

        .product-details-header .cart-icon {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .product-details-header .menu-toggle {
            display: none;
        }

        /* =====================================================
           PRODUCT DETAILS MAIN
        ===================================================== */

        .product-details-page {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 65px 0 90px;
        }

        .product-details-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;

            align-items: center;

            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(129, 140, 248, 0.22);
            border-radius: 30px;

            padding: 45px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                inset 0 0 40px rgba(99, 102, 241, 0.04);

            backdrop-filter: blur(18px);
        }

        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .product-image-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 460px;

            background:
                radial-gradient(
                    circle,
                    rgba(99, 102, 241, 0.18),
                    transparent 65%
                );

            border-radius: 25px;
        }

        .product-image-section img {
            width: 100%;
            max-width: 470px;
            max-height: 470px;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(0 25px 35px rgba(0, 0, 0, 0.55));

            transition: transform 0.45s ease;
        }

        .product-image-section img:hover {
            transform: scale(1.04);
        }

        /* =====================================================
           PRODUCT INFO
        ===================================================== */

        .product-info {
            padding: 10px 0;
        }

        .product-badge {
            display: inline-flex;
            align-items: center;

            padding: 8px 15px;
            margin-bottom: 18px;

            border-radius: 999px;

            background: linear-gradient(
                135deg,
                rgba(99, 102, 241, 0.20),
                rgba(56, 189, 248, 0.14)
            );

            border: 1px solid rgba(125, 211, 252, 0.25);

            color: #7dd3fc;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-info h1 {
            margin: 0 0 15px;

            font-size: clamp(32px, 4vw, 50px);
            line-height: 1.08;

            color: #ffffff;

            font-weight: 800;
        }

        .product-price {
            margin-bottom: 22px;

            font-size: 31px;
            font-weight: 800;

            color: #67e8f9;
        }

        .product-description {
            color: #cbd5e1;

            font-size: 15px;
            line-height: 1.8;

            margin-bottom: 28px;
        }

        /* =====================================================
           FEATURES
        ===================================================== */

        .product-features {
            margin: 0 0 30px;
            padding: 0;

            list-style: none;
        }

        .product-features li {
            position: relative;

            padding-left: 28px;
            margin-bottom: 12px;

            color: #e2e8f0;

            font-size: 14px;
            line-height: 1.6;
        }

        .product-features li::before {
            content: "✓";

            position: absolute;
            left: 0;
            top: 0;

            color: #67e8f9;

            font-weight: 800;
        }

        /* =====================================================
           QUANTITY
        ===================================================== */

        .quantity-area {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 25px;
        }

        .quantity-label {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        .quantity-control {
            display: flex;
            align-items: center;

            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;

            overflow: hidden;

            background: rgba(15, 23, 42, 0.75);
        }

        .quantity-control button {
            width: 40px;
            height: 40px;

            border: 0;

            background: transparent;
            color: #ffffff;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .quantity-control button:hover {
            background: rgba(99, 102, 241, 0.25);
        }

        .quantity-control input {
            width: 45px;
            height: 40px;

            border: 0;
            outline: none;

            background: transparent;
            color: #ffffff;

            text-align: center;

            font-size: 15px;
            font-weight: 700;
        }

        /* =====================================================
           ACTION BUTTONS
        ===================================================== */

        .product-actions {
            display: flex;
            align-items: center;
            gap: 14px;

            flex-wrap: wrap;
        }

        .product-actions button {
            border: none;
            outline: none;

            min-height: 50px;
            padding: 0 25px;

            border-radius: 13px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;
        }

        .product-actions button:hover {
            transform: translateY(-2px);
        }

        .buy-now-btn {
            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            color: #ffffff;

            box-shadow:
                0 12px 30px rgba(99, 102, 241, 0.28);
        }

        .buy-now-btn:hover {
            box-shadow:
                0 16px 38px rgba(99, 102, 241, 0.40);
        }

        .add-cart-btn {
            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(125, 211, 252, 0.28) !important;

            color: #ffffff;
        }

        .add-cart-btn:hover {
            background: rgba(56, 189, 248, 0.12);
        }

        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-products {
            margin-top: 30px;
        }

        .back-products a {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .back-products a:hover {
            color: #67e8f9;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .product-details-footer {
            width: min(1200px, 92%);
            margin: 0 auto;

            padding: 25px 0 40px;

            text-align: center;

            color: #64748b;

            font-size: 13px;

            border-top: 1px solid rgba(148, 163, 184, 0.10);
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1050px) {

            .product-details-header .nav-container {
                grid-template-columns: auto 1fr auto;
                gap: 18px;
            }

            .product-details-header .nav-menu {
                gap: 14px;
            }

            .product-details-header .nav-menu a {
                font-size: 12px;
            }

            .product-details-header .search-box {
                width: 150px;
            }

            .product-details-wrapper {
                gap: 40px;
                padding: 35px;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .product-details-header .nav-container {
                display: flex;
                justify-content: space-between;

                gap: 15px;
            }

            .product-details-header .nav-menu {
                display: none;
            }

            .product-details-header .nav-actions {
                margin-left: auto;
            }

            .product-details-header .search-box {
                display: none;
            }

            .product-details-header .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;

                width: 42px;
                height: 42px;

                border: 1px solid rgba(148, 163, 184, 0.25);
                border-radius: 10px;

                background: rgba(15, 23, 42, 0.65);

                color: #ffffff;

                cursor: pointer;
            }

            .product-details-page {
                width: 92%;
                padding-top: 35px;
            }

            .product-details-wrapper {
                grid-template-columns: 1fr;

                gap: 30px;

                padding: 25px;
            }

            .product-image-section {
                min-height: 350px;
            }

            .product-info h1 {
                font-size: 34px;
            }
        }

        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 520px) {

            .product-details-header .nav-container {
                padding: 14px 0;
            }

            .product-details-wrapper {
                padding: 20px;
                border-radius: 22px;
            }

            .product-image-section {
                min-height: 280px;
            }

            .product-image-section img {
                max-width: 320px;
                max-height: 320px;
            }

            .product-info h1 {
                font-size: 29px;
            }

            .product-price {
                font-size: 27px;
            }

            .product-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .product-actions button {
                width: 100%;
            }

            .quantity-area {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="product-details-header">

        <div class="nav-container">

            <a href="index.html" class="logo">
                DREAM<span>SHOP</span>
            </a>

            <nav class="nav-menu">

                <a href="index.html">Home</a>
                <a href="index.html#products">Products</a>
                <a href="index.html#categories">Categories</a>
                <a href="index.html#deals">Deals</a>
                <a href="index.html#about">About</a>
                <a href="index.html#contact">Contact</a>

            </nav>

            <div class="nav-actions">

                <div class="search-box">
                    <input
                        type="text"
                        id="productSearch"
                        placeholder="Search products..."
                    >
                </div>

                <a href="cart.html" class="cart-icon">
                    🛒
                    <span id="cartCount">0</span>
                </a>

                <button
                    type="button"
                    class="menu-toggle"
                    id="menuToggle"
                    aria-label="Open menu"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         PRODUCT DETAILS
    ===================================================== -->

    <main class="product-details-page">

        <div class="product-details-wrapper">

            <!-- PRODUCT IMAGE -->

            <section class="product-image-section">

                <img
                    id="productImage"
                    src=""
                    alt="Product"
                >

            </section>


            <!-- PRODUCT INFORMATION -->

            <section class="product-info">

                <div class="product-badge">
                    Premium Gadget
                </div>

                <h1 id="productName">
                    Product Name
                </h1>

                <div
                    class="product-price"
                    id="productPrice"
                >
                    ৳0
                </div>

                <p
                    class="product-description"
                    id="productDescription"
                >
                    Product description will appear here.
                </p>


                <ul
                    class="product-features"
                    id="productFeatures"
                >
                </ul>


                <!-- QUANTITY -->

                <div class="quantity-area">

                    <span class="quantity-label">
                        Quantity
                    </span>

                    <div class="quantity-control">

                        <button
                            type="button"
                            id="decreaseQty"
                        >
                            −
                        </button>

                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                            max="99"
                        >

                        <button
                            type="button"
                            id="increaseQty"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- ACTION BUTTONS -->

                <div class="product-actions">

                    <button
                        type="button"
                        class="buy-now-btn"
                        id="buyNowBtn"
                    >
                        Buy Now
                    </button>

                    <button
                        type="button"
                        class="add-cart-btn"
                        id="addToCartBtn"
                    >
                        Add to Cart
                    </button>

                </div>


                <!-- BACK -->

                <div class="back-products">

                    <a href="index.html#products">
                        ← Back to Products
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="product-details-footer">

        © 2026 Dream Shop. All rights reserved.

    </footer>


    <!-- =====================================================
         SCRIPT
    ===================================================== -->

    <script src="script.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const decreaseBtn =
                document.getElementById("decreaseQty");

            const increaseBtn =
                document.getElementById("increaseQty");

            const quantityInput =
                document.getElementById("quantity");

            const buyNowBtn =
                document.getElementById("buyNowBtn");


            /* =================================================
               DECREASE QUANTITY
            ================================================= */

            if (decreaseBtn && quantityInput) {

                decreaseBtn.addEventListener("click", function () {

                    let quantity =
                        parseInt(quantityInput.value) || 1;

                    if (quantity > 1) {
                        quantity--;
                    }

                    quantityInput.value = quantity;

                });

            }


            /* =================================================
               INCREASE QUANTITY
            ================================================= */

            if (increaseBtn && quantityInput) {

                increaseBtn.addEventListener("click", function () {

                    let quantity =
                        parseInt(quantityInput.value) || 1;

                    if (quantity < 99) {
                        quantity++;
                    }

                    quantityInput.value = quantity;

                });

            }


            /* =================================================
               QUANTITY INPUT
            ================================================= */

            if (quantityInput) {

                quantityInput.addEventListener("input", function () {

                    let quantity =
                        parseInt(this.value) || 1;

                    if (quantity < 1) {
                        quantity = 1;
                    }

                    if (quantity > 99) {
                        quantity = 99;
                    }

                    this.value = quantity;

                });

            }


            /* =================================================
               BUY NOW
            ================================================= */

            if (buyNowBtn) {

                buyNowBtn.addEventListener("click", function () {

                    const productNameElement =
                        document.getElementById("productName");

                    const productPriceElement =
                        document.getElementById("productPrice");

                    const productImageElement =
                        document.getElementById("productImage");


                    const productName =
                        productNameElement
                            ? productNameElement.textContent.trim()
                            : "";


                    const productPriceText =
                        productPriceElement
                            ? productPriceElement.textContent.trim()
                            : "৳0";


                    const productImage =
                        productImageElement
                            ? productImageElement.getAttribute("src")
                            : "";


                    let quantity =
                        parseInt(quantityInput.value) || 1;


                    if (quantity < 1) {
                        quantity = 1;
                    }

                    if (quantity > 99) {
                        quantity = 99;
                    }


                    /* Convert price to number */

                    const productPrice =
                        parseInt(
                            productPriceText.replace(/[^\d]/g, "")
                        ) || 0;


                    /* Create selected product */

                    const buyNowProduct = {

                        id: "buy-now-" + Date.now(),

                        name: productName,

                        price: productPrice,

                        image: productImage,

                        quantity: quantity,

                        total: productPrice * quantity

                    };


                    /* Save Buy Now product */

                    localStorage.setItem(
                        "dreamShopBuyNow",
                        JSON.stringify(buyNowProduct)
                    );


                    /* Also create checkout cart */

                    const checkoutItem = {

                        id: buyNowProduct.id,

                        name: buyNowProduct.name,

                        price: buyNowProduct.price,

                        image: buyNowProduct.image,

                        quantity: buyNowProduct.quantity,

                        total: buyNowProduct.total

                    };


                    localStorage.setItem(
                        "dreamShopCheckoutItems",
                        JSON.stringify([checkoutItem])
                    );


                    /* Go to Order page */

                    window.location.href = "checkout.html";

                });

            }

        });

    </script>

</body>
</html>
