
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Dream Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f8ff, #eaf2ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #14213d;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 24px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 60, 150, 0.12);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e8fff2;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 17px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }

        .thank-you {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin: 25px 0;
            color: #475569;
            line-height: 1.7;
        }

        .home-button {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .home-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .thank-you {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="success-icon">
            ✓
        </div>

        <div class="thank-you">
            Thank You! ❤️
        </div>

        <h1>Order Confirmed</h1>

        <p class="subtitle">
            Your order has been successfully placed.
            We will contact you soon to confirm your order.
        </p>

        <div class="info-box">
            📦 <strong>Your order is being processed.</strong><br>
            Please keep your phone available for our delivery team.
        </div>

        <a href="index.html" class="home-button">
            🏠 Continue Shopping
        </a>

        <div class="footer">
            © 2026 Dream Shop — Smart Gadgets • Better Life
        </div>

    </div>

</body>
</html>
